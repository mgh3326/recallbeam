version: 1
enabled: true
required_checks:
  - vet
  - test
  - build-linux-amd64
  - build-linux-arm64
  - build-darwin-amd64
  - build-darwin-arm64
blocking:
  - paths: [.mergewake/**, .github/workflows/**]
    reason: Changes to verification can bypass recovery controls
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50
